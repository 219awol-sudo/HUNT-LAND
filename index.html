<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>HuntLand</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08130e;
  color: #f5f5f5;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

#topBar {
  height: 86px;
  min-height: 86px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #0b1911;
  border-bottom: 1px solid #26382d;
  z-index: 3000;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  white-space: nowrap;
}

.logo span {
  color: #4fd06c;
}

.searchWrap {
  flex: 1;
  position: relative;
}

#searchBox {
  width: 100%;
  height: 48px;
  border: 1px solid #32493a;
  border-radius: 14px;
  background: #101e16;
  color: white;
  padding: 0 48px 0 14px;
  font-size: 16px;
  outline: none;
}

#searchBtn {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 10px;
  background: #243b2c;
  color: white;
  font-size: 20px;
}

#locateBtn {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border-radius: 14px;
  border: 1px solid #32493a;
  background: #172a1e;
  color: white;
  font-size: 23px;
}

#mapWrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
}

#map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #142019;
  z-index: 1;
}

.leaflet-container {
  background: #142019 !important;
}

#resultsPanel {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  max-height: 45%;
  overflow-y: auto;
  background: rgba(8, 19, 14, 0.96);
  border: 1px solid #35503f;
  border-radius: 16px;
  z-index: 2000;
  display: none;
}

.resultItem {
  padding: 13px 14px;
  border-bottom: 1px solid #25382c;
  cursor: pointer;
}

.resultItem:last-child {
  border-bottom: 0;
}

.resultTitle {
  font-weight: 800;
  font-size: 16px;
}

.resultSub {
  color: #b8c5bc;
  font-size: 13px;
  margin-top: 4px;
}

#bottomSheet {
  position: fixed;
  z-index: 3500;
  left: 0;
  right: 0;
  bottom: 0;
  height: 92px;
  background: #101f16;
  border: 1px solid #32493a;
  border-bottom: none;
  border-radius: 28px 28px 0 0;
  transition: height 0.25s ease;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

#bottomSheet.open {
  height: min(72vh, 610px);
}

.sheetHandle {
  width: 84px;
  height: 7px;
  border-radius: 10px;
  background: #7c8d82;
  margin: 12px auto 6px;
}

.sheetTitle {
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  padding: 3px 0 13px;
  cursor: pointer;
}

.sheetBody {
  height: calc(100% - 65px);
  overflow-y: auto;
  padding: 0 16px 30px;
}

.toolGrid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.toolBtn {
  min-height: 52px;
  border: 1px solid #35503f;
  border-radius: 14px;
  background: #182b1f;
  color: white;
  font-size: 15px;
  font-weight: 700;
}

.toolBtn.active {
  outline: 2px solid #50ce6c;
}

.section {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #2b4033;
}

.sectionTitle {
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 10px;
}

#publicLandList {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.landBtn {
  text-align: left;
  border: 1px solid #314b3a;
  background: #13251a;
  color: white;
  padding: 12px;
  border-radius: 12px;
}

.landBtn strong {
  display: block;
  font-size: 15px;
}

.landBtn small {
  display: block;
  margin-top: 3px;
  color: #b5c4ba;
}

.infoBox {
  display: none;
  background: #0d1a12;
  border: 1px solid #36523f;
  border-radius: 14px;
  padding: 14px;
  margin-top: 12px;
  line-height: 1.45;
}

.infoBox.show {
  display: block;
}

.pinPopup button {
  width: 100%;
  margin-top: 6px;
  padding: 7px;
  border: 0;
  border-radius: 7px;
}

.trailLine {
  stroke-dasharray: 7 5;
}

.customPin {
  width: 28px;
  height: 28px;
  border-radius: 50% 50% 50% 0;
  background: #ff7c32;
  border: 3px solid white;
  transform: rotate(-45deg);
  box-shadow: 0 2px 7px rgba(0,0,0,.5);
}

.customPin:after {
  content: "";
  width: 8px;
  height: 8px;
  background: white;
  position: absolute;
  left: 7px;
  top: 7px;
  border-radius: 50%;
}

.leaflet-control-zoom {
  margin-bottom: 105px !important;
}

@media (max-width: 520px) {
  #topBar {
    padding: 10px 10px;
  }

  .logo {
    font-size: 24px;
  }

  #searchBox {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header id="topBar">
  <div class="logo">Hunt<span>Land</span></div>

  <div class="searchWrap">
    <input
      id="searchBox"
      type="text"
      placeholder="Search public land, trail, refuge..."
      autocomplete="off"
    >
    <button id="searchBtn">⌕</button>
  </div>

  <button id="locateBtn" title="My Location">◎</button>
</header>

<div id="mapWrap">
  <div id="map"></div>
  <div id="resultsPanel"></div>
</div>

<div id="bottomSheet">
  <div class="sheetHandle"></div>
  <div id="sheetTitle" class="sheetTitle">Map Tools</div>

  <div class="sheetBody">

    <div class="toolGrid">
      <button id="pinTool" class="toolBtn">📍 Drop Pin</button>
      <button id="trailsTool" class="toolBtn active">🥾 Trails</button>
      <button id="launchTool" class="toolBtn active">🚤 Boat Launches</button>
      <button id="probabilityTool" class="toolBtn active">🦌 Deer Areas</button>
      <button id="landTool" class="toolBtn active">🗺 Public Land</button>
      <button id="satelliteTool" class="toolBtn">🛰 Satellite</button>
      <button id="infoTool" class="toolBtn">ℹ Land Info</button>
      <button id="regTool" class="toolBtn">📖 Regulations</button>
    </div>

    <div id="infoBox" class="infoBox"></div>

    <div class="section">
      <div class="sectionTitle">Public Land</div>
      <div id="publicLandList"></div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const mapElement = document.getElementById("map");

  if (!mapElement) {
    alert("Map container not found.");
    return;
  }

  const map = L.map("map", {
    zoomControl: true,
    attributionControl: true
  }).setView([31.35, -91.15], 7);

  const streetLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  );

  const topoLayer = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 17,
      attribution: "Map data &copy; OpenStreetMap contributors"
    }
  );

  const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri"
    }
  );

  streetLayer.addTo(map);

  const publicLandLayer = L.layerGroup().addTo(map);
  const trailsLayer = L.layerGroup().addTo(map);
  const launchLayer = L.layerGroup().addTo(map);
  const probabilityLayer = L.layerGroup().addTo(map);
  const userPinsLayer = L.layerGroup().addTo(map);

  const publicLands = [
    {
      id: "rky",
      name: "Richard K. Yancey WMA",
      state: "Louisiana",
      type: "Wildlife Management Area",
      lat: 31.0008,
      lng: -91.7216,
      zoom: 12,
      regulations: "Check current LDWF regulations, season dates, WMA rules, permits, weapon restrictions and access rules before hunting.",
      description: "Large Louisiana WMA in the Mississippi/Red River floodplain region."
    },
    {
      id: "panther",
      name: "Panther Swamp National Wildlife Refuge",
      state: "Mississippi",
      type: "National Wildlife Refuge",
      lat: 32.762,
      lng: -90.59,
      zoom: 11,
      regulations: "Federal refuge rules apply in addition to applicable Mississippi hunting regulations. Verify current refuge-specific seasons, access and permit requirements.",
      description: "National Wildlife Refuge in the Mississippi Delta."
    },
    {
      id: "homochitto",
      name: "Homochitto National Forest",
      state: "Mississippi",
      type: "National Forest",
      lat: 31.43,
      lng: -90.93,
      zoom: 10,
      regulations: "National Forest hunting is generally governed by Mississippi seasons plus any federal or site-specific restrictions. Always verify the current regulations.",
      description: "National Forest in southwest Mississippi."
    },
    {
      id: "desoto",
      name: "De Soto National Forest",
      state: "Mississippi",
      type: "National Forest",
      lat: 31.11,
      lng: -89.10,
      zoom: 9,
      regulations: "Verify current Mississippi hunting seasons and any De Soto National Forest closures or special rules.",
      description: "National Forest in southern Mississippi."
    },
    {
      id: "delta",
      name: "Delta National Forest",
      state: "Mississippi",
      type: "National Forest",
      lat: 32.78,
      lng: -90.74,
      zoom: 11,
      regulations: "Verify current Mississippi hunting regulations and federal forest restrictions before hunting.",
      description: "Bottomland hardwood National Forest in the Mississippi Delta."
    },
    {
      id: "kisatchie",
      name: "Kisatchie National Forest",
      state: "Louisiana",
      type: "National Forest",
      lat: 31.30,
      lng: -92.52,
      zoom: 8,
      regulations: "Louisiana hunting seasons apply along with any Kisatchie National Forest-specific restrictions or closures.",
      description: "Louisiana's National Forest system."
    }
  ];

  let selectedLand = null;
  let pinMode = false;
  let satelliteOn = false;

  const landMarkers = {};

  function addPublicLandMarkers() {
    publicLands.forEach(function (land) {
      const marker = L.circleMarker([land.lat, land.lng], {
        radius: 10,
        color: "#ffffff",
        weight: 2,
        fillColor: "#35c75a",
        fillOpacity: 0.9
      });

      marker.bindPopup(
        "<b>" + land.name + "</b><br>" +
        land.type + "<br>" +
        land.state
      );

      marker.on("click", function () {
        selectedLand = land;
      });

      marker.addTo(publicLandLayer);
      landMarkers[land.id] = marker;
    });
  }

  addPublicLandMarkers();

  const trailData = [
    {
      name: "Richard K. Yancey Access Route",
      points: [
        [31.017, -91.736],
        [31.011, -91.724],
        [31.002, -91.713],
        [30.993, -91.704]
      ]
    },
    {
      name: "Panther Swamp Access Route",
      points: [
        [32.79, -90.61],
        [32.775, -90.598],
        [32.758, -90.585],
        [32.744, -90.571]
      ]
    }
  ];

  trailData.forEach(function (trail) {
    L.polyline(trail.points, {
      color: "#f5a623",
      weight: 4,
      opacity: 0.95,
      className: "trailLine"
    })
    .bindPopup("<b>" + trail.name + "</b>")
    .addTo(trailsLayer);
  });

  const launches = [
    {
      name: "Richard K. Yancey Area Boat Access",
      lat: 31.008,
      lng: -91.746
    },
    {
      name: "Panther Swamp Area Boat Access",
      lat: 32.766,
      lng: -90.618
    }
  ];

  launches.forEach(function (launch) {
    L.circleMarker([launch.lat, launch.lng], {
      radius: 8,
      color: "#ffffff",
      weight: 2,
      fillColor: "#3298ff",
      fillOpacity: 1
    })
    .bindPopup("🚤 <b>" + launch.name + "</b>")
    .addTo(launchLayer);
  });

  const deerAreas = [
    {
      name: "Richard K. Yancey Deer Habitat Zone",
      center: [31.004, -91.718],
      radius: 2200
    },
    {
      name: "Panther Swamp Deer Habitat Zone",
      center: [32.761, -90.584],
      radius: 2800
    }
  ];

  deerAreas.forEach(function (area) {
    L.circle(area.center, {
      radius: area.radius,
      color: "#b94cff",
      weight: 2,
      fillColor: "#b94cff",
      fillOpacity: 0.19
    })
    .bindPopup(
      "<b>" + area.name + "</b><br>" +
      "Purple areas are habitat-oriented map highlights, not guaranteed deer locations."
    )
    .addTo(probabilityLayer);
  });

  const publicLandList = document.getElementById("publicLandList");

  publicLands.forEach(function (land) {
    const button = document.createElement("button");
    button.className = "landBtn";

    button.innerHTML =
      "<strong>" + land.name + "</strong>" +
      "<small>" + land.type + " · " + land.state + "</small>";

    button.addEventListener("click", function () {
      selectedLand = land;

      map.flyTo(
        [land.lat, land.lng],
        land.zoom,
        {
          duration: 1.1
        }
      );

      if (landMarkers[land.id]) {
        setTimeout(function () {
          landMarkers[land.id].openPopup();
        }, 900);
      }

      closeSheet();
    });

    publicLandList.appendChild(button);
  });

  const bottomSheet = document.getElementById("bottomSheet");
  const sheetTitle = document.getElementById("sheetTitle");

  function openSheet() {
    bottomSheet.classList.add("open");

    setTimeout(function () {
      map.invalidateSize();
    }, 280);
  }

  function closeSheet() {
    bottomSheet.classList.remove("open");

    setTimeout(function () {
      map.invalidateSize();
    }, 280);
  }

  sheetTitle.addEventListener("click", function () {
    if (bottomSheet.classList.contains("open")) {
      closeSheet();
    } else {
      openSheet();
    }
  });

  document.querySelector(".sheetHandle").addEventListener("click", function () {
    if (bottomSheet.classList.contains("open")) {
      closeSheet();
    } else {
      openSheet();
    }
  });
    const trailsTool = document.getElementById("trailsTool");
  const launchTool = document.getElementById("launchTool");
  const probabilityTool = document.getElementById("probabilityTool");
  const landTool = document.getElementById("landTool");
  const satelliteTool = document.getElementById("satelliteTool");
  const pinTool = document.getElementById("pinTool");
  const infoTool = document.getElementById("infoTool");
  const regTool = document.getElementById("regTool");
  const infoBox = document.getElementById("infoBox");

  trailsTool.addEventListener("click", function () {
    if (map.hasLayer(trailsLayer)) {
      map.removeLayer(trailsLayer);
      trailsTool.classList.remove("active");
    } else {
      trailsLayer.addTo(map);
      trailsTool.classList.add("active");
    }
  });

  launchTool.addEventListener("click", function () {
    if (map.hasLayer(launchLayer)) {
      map.removeLayer(launchLayer);
      launchTool.classList.remove("active");
    } else {
      launchLayer.addTo(map);
      launchTool.classList.add("active");
    }
  });

  probabilityTool.addEventListener("click", function () {
    if (map.hasLayer(probabilityLayer)) {
      map.removeLayer(probabilityLayer);
      probabilityTool.classList.remove("active");
    } else {
      probabilityLayer.addTo(map);
      probabilityTool.classList.add("active");
    }
  });

  landTool.addEventListener("click", function () {
    if (map.hasLayer(publicLandLayer)) {
      map.removeLayer(publicLandLayer);
      landTool.classList.remove("active");
    } else {
      publicLandLayer.addTo(map);
      landTool.classList.add("active");
    }
  });

  satelliteTool.addEventListener("click", function () {
    satelliteOn = !satelliteOn;

    if (satelliteOn) {
      if (map.hasLayer(streetLayer)) {
        map.removeLayer(streetLayer);
      }

      if (map.hasLayer(topoLayer)) {
        map.removeLayer(topoLayer);
      }

      satelliteLayer.addTo(map);
      satelliteTool.classList.add("active");
    } else {
      if (map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
      }

      streetLayer.addTo(map);
      satelliteTool.classList.remove("active");
    }
  });

  pinTool.addEventListener("click", function () {
    pinMode = !pinMode;

    if (pinMode) {
      pinTool.classList.add("active");
      pinTool.textContent = "📍 Tap Map";
      closeSheet();
    } else {
      pinTool.classList.remove("active");
      pinTool.textContent = "📍 Drop Pin";
    }
  });

  const pinIcon = L.divIcon({
    className: "",
    html: '<div class="customPin"></div>',
    iconSize: [30, 38],
    iconAnchor: [15, 34]
  });

  map.on("click", function (event) {
    if (!pinMode) return;

    const marker = L.marker(event.latlng, {
      icon: pinIcon,
      draggable: true
    }).addTo(userPinsLayer);

    marker.bindPopup(
      '<div class="pinPopup">' +
      '<b>My Hunting Pin</b><br>' +
      'Lat: ' + event.latlng.lat.toFixed(5) + '<br>' +
      'Lng: ' + event.latlng.lng.toFixed(5) + '<br>' +
      '<button onclick="this.closest(\'.leaflet-popup\').remove()">Close</button>' +
      '</div>'
    );

    marker.openPopup();

    pinMode = false;
    pinTool.classList.remove("active");
    pinTool.textContent = "📍 Drop Pin";
  });

  infoTool.addEventListener("click", function () {
    openSheet();

    if (!selectedLand) {
      infoBox.innerHTML =
        "<b>Select a public land area first.</b><br>" +
        "Tap a public-land marker or choose an area from the Public Land list.";

      infoBox.classList.add("show");
      return;
    }

    infoBox.innerHTML =
      "<b>" + selectedLand.name + "</b><br><br>" +
      "<b>Type:</b> " + selectedLand.type + "<br>" +
      "<b>State:</b> " + selectedLand.state + "<br><br>" +
      selectedLand.description;

    infoBox.classList.add("show");
  });

  regTool.addEventListener("click", function () {
    openSheet();

    if (!selectedLand) {
      infoBox.innerHTML =
        "<b>Select a public land area first.</b><br>" +
        "Then tap Regulations.";

      infoBox.classList.add("show");
      return;
    }

    infoBox.innerHTML =
      "<b>" + selectedLand.name + " Regulations</b><br><br>" +
      selectedLand.regulations +
      "<br><br><b>Important:</b> Always confirm current official regulations before hunting because seasons, permits, closures and weapon rules can change.";

    infoBox.classList.add("show");
  });

  document.getElementById("locateBtn").addEventListener("click", function () {
    if (!navigator.geolocation) {
      alert("Location is not supported on this device.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        map.flyTo([lat, lng], 14);

        L.circleMarker([lat, lng], {
          radius: 9,
          color: "#ffffff",
          weight: 3,
          fillColor: "#2e8cff",
          fillOpacity: 1
        })
        .bindPopup("<b>Your Location</b>")
        .addTo(map)
        .openPopup();
      },

      function () {
        alert(
          "Your location could not be found. Make sure Safari has permission to use your location."
        );
      },

      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );
  });

  const searchBox = document.getElementById("searchBox");
  const searchBtn = document.getElementById("searchBtn");
  const resultsPanel = document.getElementById("resultsPanel");

  function runSearch() {
    const query = searchBox.value.trim().toLowerCase();

    resultsPanel.innerHTML = "";

    if (!query) {
      resultsPanel.style.display = "none";
      return;
    }

    const results = publicLands.filter(function (land) {
      return (
        land.name.toLowerCase().includes(query) ||
        land.state.toLowerCase().includes(query) ||
        land.type.toLowerCase().includes(query)
      );
    });

    if (results.length === 0) {
      resultsPanel.innerHTML =
        '<div class="resultItem">' +
        '<div class="resultTitle">No matching public land found</div>' +
        '<div class="resultSub">Try another name.</div>' +
        '</div>';

      resultsPanel.style.display = "block";
      return;
    }

    results.forEach(function (land) {
      const item = document.createElement("div");
      item.className = "resultItem";

      item.innerHTML =
        '<div class="resultTitle">' + land.name + '</div>' +
        '<div class="resultSub">' +
        land.type + " · " + land.state +
        '</div>';

      item.addEventListener("click", function () {
        selectedLand = land;

        map.flyTo(
          [land.lat, land.lng],
          land.zoom,
          {
            duration: 1
          }
        );

        resultsPanel.style.display = "none";
        searchBox.value = "";

        if (landMarkers[land.id]) {
          setTimeout(function () {
            landMarkers[land.id].openPopup();
          }, 800);
        }
      });

      resultsPanel.appendChild(item);
    });

    resultsPanel.style.display = "block";
  }

  searchBtn.addEventListener("click", runSearch);

  searchBox.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      runSearch();
    }
  });

  searchBox.addEventListener("input", function () {
    if (!searchBox.value.trim()) {
      resultsPanel.style.display = "none";
    }
  });

  L.control.layers(
    {
      "Street Map": streetLayer,
      "Topographic": topoLayer,
      "Satellite": satelliteLayer
    },
    {
      "Public Land": publicLandLayer,
      "Trails": trailsLayer,
      "Boat Launches": launchLayer,
      "Deer Areas": probabilityLayer,
      "My Pins": userPinsLayer
    },
    {
      position: "topright",
      collapsed: true
    }
  ).addTo(map);

  function resizeMap() {
    const topBarHeight =
      document.getElementById("topBar").getBoundingClientRect().height;

    const availableHeight =
      window.innerHeight - topBarHeight;

    document.getElementById("mapWrap").style.height =
      availableHeight + "px";

    map.invalidateSize(true);
  }

  resizeMap();

  window.addEventListener("resize", function () {
    resizeMap();
  });

  window.addEventListener("orientationchange", function () {
    setTimeout(function () {
      resizeMap();
      map.invalidateSize(true);
    }, 300);
  });

  setTimeout(function () {
    map.invalidateSize(true);
  }, 100);

  setTimeout(function () {
    map.invalidateSize(true);
  }, 500);

  setTimeout(function () {
    map.invalidateSize(true);
  }, 1200);

});
</script>
